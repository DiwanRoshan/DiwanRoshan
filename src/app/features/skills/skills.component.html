<section id="skills" class="section skills">
  <div class="container">
    <!-- Section Header -->
    <div class="section-header">
      <span class="section-label">Skills</span>
      <h2 class="section-title">My Tech Stack</h2>
      <p class="section-subtitle">
        Technologies and tools I use to bring ideas to life
      </p>
    </div>

    <!-- Category Tabs -->
    <div class="skills-categories">
      <button 
        *ngFor="let category of categories; trackBy: trackByCategory"
        class="category-tab"
        [class.active]="activeCategory === category.key"
        (click)="setActiveCategory(category.key)">
        <ng-container [ngSwitch]="category.icon">
          <svg *ngSwitchCase="'layout'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="21" x2="9" y2="9"/>
          </svg>
          <svg *ngSwitchCase="'server'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"/>
            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"/>
            <line x1="6" y1="6" x2="6.01" y2="6"/>
            <line x1="6" y1="18" x2="6.01" y2="18"/>
          </svg>
          <svg *ngSwitchCase="'tool'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </ng-container>
        <span>{{ category.label }}</span>
      </button>
    </div>

    <!-- Skills Grid -->
    <div class="skills-grid">
      <div 
        *ngFor="let skill of displayedSkills; trackBy: trackBySkill" 
        class="skill-card">
        <div class="skill-icon" [style.background]="skill.background">
          <span class="icon-svg" [style.color]="skill.color" [innerHTML]="skill.svg"></span>
        </div>
        <div class="skill-info">
          <h4 class="skill-name">{{ skill.name }}</h4>
          <div class="skill-bar">
            <div class="skill-progress" [style.width.%]="skill.level" [style.background]="skill.gradient"></div>
          </div>
          <span class="skill-level">{{ skill.level }}%</span>
        </div>
      </div>
    </div>

    <!-- Additional Skills Tags -->
    <div class="skills-extra">
      <h4>Also familiar with:</h4>
      <div class="tags-container">
        <span class="tag">Redux</span>
        <span class="tag">RxJS</span>
        <span class="tag">NgRx</span>
        <span class="tag">Next.js</span>
        <span class="tag">Nuxt.js</span>
        <span class="tag">REST APIs</span>
        <span class="tag">WebSockets</span>
        <span class="tag">OAuth</span>
        <span class="tag">JWT</span>
        <span class="tag">Agile/Scrum</span>
        <span class="tag">Linux</span>
        <span class="tag">Nginx</span>
      </div>
    </div>
  </div>
</section>
