<section id="experience" class="section experience">
  <div class="container">
    <!-- Section Header -->
    <div class="section-header">
      <span class="section-label">Experience</span>
      <h2 class="section-title">My Journey</h2>
      <p class="section-subtitle">
        A timeline of my professional growth and achievements
      </p>
    </div>

    <!-- Timeline -->
    <div class="experience-timeline">
      <div class="timeline-line"></div>
      
      <article 
        *ngFor="let exp of experiences; let i = index; let isOdd = odd; trackBy: trackByExperience" 
        class="timeline-item"
        [class.odd]="isOdd">
        
        <!-- Timeline Dot -->
        <div class="timeline-dot">
          <div class="dot-inner"></div>
        </div>
        
        <!-- Timeline Content -->
        <div class="timeline-content">
          <div class="timeline-header">
            <span class="timeline-date">{{ exp.startDate }} - {{ exp.endDate }}</span>
            <h3 class="timeline-title">{{ exp.role }}</h3>
            <div class="timeline-company">
              <a *ngIf="exp.companyUrl" [href]="exp.companyUrl" target="_blank" rel="noopener noreferrer">
                {{ exp.company }}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                  <polyline points="15 3 21 3 21 9"/>
                  <line x1="10" y1="14" x2="21" y2="3"/>
                </svg>
              </a>
              <span *ngIf="!exp.companyUrl">{{ exp.company }}</span>
              <span class="location">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                  <circle cx="12" cy="10" r="3"/>
                </svg>
                {{ exp.location }}
              </span>
            </div>
          </div>
          
          <ul class="timeline-description">
            <li *ngFor="let item of exp.description; trackBy: trackByText">{{ item }}</li>
          </ul>
          
          <div class="timeline-technologies">
            <span *ngFor="let tech of exp.technologies; trackBy: trackByText" class="tech-tag">{{ tech }}</span>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
