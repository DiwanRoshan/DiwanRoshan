<section id="projects" class="section projects">
  <div class="container">
    <!-- Section Header -->
    <div class="section-header">
      <span class="section-label">Portfolio</span>
      <h2 class="section-title">Featured Projects</h2>
      <p class="section-subtitle">
        A selection of projects I've worked on recently
      </p>
    </div>

    <!-- Filter Buttons -->
    <div class="projects-filter">
      <button 
        class="filter-btn"
        [class.active]="activeFilter === 'all'"
        (click)="filterProjects('all')">
        All Projects
      </button>
      <button 
        class="filter-btn"
        [class.active]="activeFilter === 'featured'"
        (click)="filterProjects('featured')">
        Featured
      </button>
      <button 
        *ngFor="let tag of allTags.slice(0, 4); trackBy: trackByTag"
        class="filter-btn"
        [class.active]="activeFilter === tag"
        (click)="filterProjects(tag)">
        {{ tag }}
      </button>
    </div>

    <!-- Projects Grid -->
    <div class="projects-grid">
      <article 
        *ngFor="let project of filteredProjects; let i = index; trackBy: trackByProject" 
        class="project-card"
        [class.featured]="project.featured">
        
        <!-- Project Image -->
        <div class="project-image">
          <div class="image-overlay"></div>
          <img [src]="project.image" [alt]="project.title" loading="lazy" onerror="this.style.display='none'">
          <div class="image-placeholder">
            <span>{{ project.title.charAt(0) }}</span>
          </div>
          
          <!-- Project Links Overlay -->
          <div class="project-links-overlay">
            <a *ngIf="project.liveUrl" [href]="project.liveUrl" target="_blank" rel="noopener noreferrer" class="project-link" aria-label="View Live Demo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" y1="14" x2="21" y2="3"/>
              </svg>
            </a>
            <a *ngIf="project.githubUrl" [href]="project.githubUrl" target="_blank" rel="noopener noreferrer" class="project-link" aria-label="View Source Code">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
              </svg>
            </a>
          </div>
        </div>

        <!-- Project Info -->
        <div class="project-info">
          <div class="project-tags">
            <span *ngFor="let tag of project.tags.slice(0, 3); trackBy: trackByTag" class="project-tag">{{ tag }}</span>
          </div>
          <h3 class="project-title">{{ project.title }}</h3>
          <p class="project-description">{{ project.description }}</p>
          
          <div class="project-footer">
            <a *ngIf="project.liveUrl" [href]="project.liveUrl" target="_blank" rel="noopener noreferrer" class="view-project">
              View Project
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </a>
            <a *ngIf="!project.liveUrl && project.githubUrl" [href]="project.githubUrl" target="_blank" rel="noopener noreferrer" class="view-project">
              View Code
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </a>
          </div>
        </div>
      </article>
    </div>

    <!-- View More Button -->
    <div class="projects-cta" *ngIf="filteredProjects.length > 6">
      <button class="btn btn-outline">
        View All Projects
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>
</section>
