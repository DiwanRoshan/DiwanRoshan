<section id="blog" class="section blog">
  <div class="container">
    <!-- Section Header -->
    <div class="section-header">
      <span class="section-label">Blog</span>
      <h2 class="section-title">Latest Articles</h2>
      <p class="section-subtitle">
        Thoughts, tutorials, and insights on web development
      </p>
    </div>

    <!-- Blog Grid -->
    <div class="blog-grid">
      <article *ngFor="let post of posts" class="blog-card">
        <!-- Card Image -->
        <div class="card-image">
          <img [src]="post.coverImage" [alt]="post.title" loading="lazy" onerror="this.style.display='none'">
          <div class="image-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/>
            </svg>
          </div>
          <div class="card-overlay"></div>
        </div>
        
        <!-- Card Content -->
        <div class="card-content">
          <!-- Tags -->
          <div class="card-tags">
            <span *ngFor="let tag of post.tags.slice(0, 2)" class="card-tag">{{ tag }}</span>
          </div>
          
          <!-- Title -->
          <h3 class="card-title">{{ post.title }}</h3>
          
          <!-- Excerpt -->
          <p class="card-excerpt">{{ post.excerpt }}</p>
          
          <!-- Meta -->
          <div class="card-meta">
            <span class="meta-date">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
              {{ formatDate(post.publishedAt) }}
            </span>
            <span class="meta-read">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
              {{ post.readTime }} min read
            </span>
          </div>
          
          <!-- Read More -->
          <a [routerLink]="['/blog', post.id]" class="read-more">
            Read Article
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </a>
        </div>
      </article>
    </div>

    <!-- View All Button -->
    <div class="blog-cta" *ngIf="posts.length > 3">
      <a routerLink="/blog" class="btn btn-outline">
        View All Articles
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>
  </div>
</section>
