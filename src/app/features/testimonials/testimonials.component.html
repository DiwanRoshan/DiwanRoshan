<section id="testimonials" class="section testimonials">
  <div class="container">
    <!-- Section Header -->
    <div class="section-header">
      <span class="section-label">Testimonials</span>
      <h2 class="section-title">What People Say</h2>
      <p class="section-subtitle">
        Feedback from colleagues and clients I've had the pleasure to work with
      </p>
    </div>

    <!-- Testimonials Slider -->
    <div class="testimonials-slider">
      <!-- Quote Icon -->
      <div class="quote-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M4.583 17.321C3.553 16.227 3 15 3 13.011c0-3.5 2.457-6.637 6.03-8.188l.893 1.378c-3.335 1.804-3.987 4.145-4.247 5.621.537-.278 1.24-.375 1.929-.311 1.804.167 3.226 1.648 3.226 3.489a3.5 3.5 0 01-3.5 3.5c-1.073 0-2.099-.49-2.748-1.179zm10 0C13.553 16.227 13 15 13 13.011c0-3.5 2.457-6.637 6.03-8.188l.893 1.378c-3.335 1.804-3.987 4.145-4.247 5.621.537-.278 1.24-.375 1.929-.311 1.804.167 3.226 1.648 3.226 3.489a3.5 3.5 0 01-3.5 3.5c-1.073 0-2.099-.49-2.748-1.179z"/>
        </svg>
      </div>

      <!-- Slides Container -->
      <div class="slides-container">
        <div 
          *ngFor="let testimonial of testimonials; let i = index"
          class="testimonial-slide"
          [class.active]="i === currentIndex"
          [class.prev]="i === (currentIndex - 1 + testimonials.length) % testimonials.length"
          [class.next]="i === (currentIndex + 1) % testimonials.length">
          
          <!-- Stars -->
          <div class="testimonial-rating">
            <svg *ngFor="let star of getStars(testimonial.rating)" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
          </div>
          
          <!-- Quote -->
          <blockquote class="testimonial-quote">
            "{{ testimonial.quote }}"
          </blockquote>
          
          <!-- Author -->
          <div class="testimonial-author">
            <div class="author-avatar">
              <img [src]="testimonial.image" [alt]="testimonial.name" onerror="this.style.display='none'">
              <div class="avatar-placeholder">
                {{ testimonial.name.charAt(0) }}
              </div>
            </div>
            <div class="author-info">
              <h4 class="author-name">{{ testimonial.name }}</h4>
              <p class="author-role">{{ testimonial.role }}, {{ testimonial.company }}</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Navigation -->
      <div class="slider-nav">
        <button class="nav-btn prev" (click)="prev()" aria-label="Previous testimonial">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        
        <div class="slider-dots">
          <button 
            *ngFor="let testimonial of testimonials; let i = index"
            class="dot"
            [class.active]="i === currentIndex"
            (click)="goTo(i)"
            [attr.aria-label]="'Go to testimonial ' + (i + 1)">
          </button>
        </div>
        
        <button class="nav-btn next" (click)="next()" aria-label="Next testimonial">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
